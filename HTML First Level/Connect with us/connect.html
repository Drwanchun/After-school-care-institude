<head>
  <meta charset="UTF-8" />

  <!-- 引入全局 CSS -->
  <link rel="stylesheet" href="../../File/css/Main.css" />
</head>
<body>

  <!-- 1. 顶部固定导航栏 -->
  <header class="navbar">
    <div class="logo-area">
      <!-- 📷【图片插图位置 1】：Logo 图片 -->
      <img src="../../img/img Logo.png" alt="润育托管Logo" class="logo-img" />
      <span class="site-title">润育托管中心</span>
    </div>
    <nav class="nav-links">
      <a href="../../index.html">首页</a>
      <a href="../Institute-Introduction/Introduction.html">简介</a>
      <a href="../More detail/detail.html">详情</a>
      <a href="../Teacher's team/teacher.html">师资团队</a>
      <a href="connect.html" class="active">联系我们</a>
    </nav>
  </header>

  <!-- 2. 页面顶部横幅 -->
  <div class="page-banner">
    <h1>联系我们</h1>
    <p class="banner-subtitle">随时欢迎家长到店参观考察与咨询服务</p>
  </div>

  <!-- 3. 主体内容区 -->
  <main class="main-container">

    <section class="info-card">
      <span class="badge">沟通交流</span>
      <h2>机构联系方式与地址</h2>

      <div class="contact-layout">
        <!-- 左侧：文字联系信息 -->
        <div class="contact-info-box">
          <div class="info-item">
            <span class="icon">📍</span>
            <div>
              <strong>机构地址：</strong>
              <p>贵州省安顺市西秀区茶城xx街xx号（润育托管中心）</p>
            </div>
          </div>

          <div class="info-item">
            <span class="icon">📞</span>
            <div>
              <strong>咨询电话：</strong>
              <p>138-xxxx-xxxx / 0851-xxxxxxx</p>
            </div>
          </div>

          <div class="info-item">
            <span class="icon">⏰</span>
            <div>
              <strong>接待时间：</strong>
              <p>周一至周日 08:30 - 20:30</p>
            </div>
          </div>

          <div class="info-item">
            <span class="icon">💬</span>
            <div>
              <strong>微信咨询：</strong>
              <p>添加微信了解最新托管名额与套餐优惠</p>
            </div>
          </div>
        </div>

        <!-- 右侧：📷【图片插图位置 2】：地图截图 / 门头实拍图 -->
        <div class="contact-map-box">
          <img src="../../img/img1.jpg" alt="润育托管中心正门/位置地图" />
          <div class="map-label">📍 润育托管中心门口实拍及地理位置</div>
        </div>
      </div>
    </section>

   <!-- 修改后：-->
<section class="info-card">
  <span class="badge">快速留言</span>
  <h2>预约参观 / 课程咨询</h2>
  <form class="contact-form" id="consultForm" onsubmit="handleFormSubmit(event)">
    <div class="form-group">
      <label>家长姓名：</label>
      <input type="text" id="parentNameInput" placeholder="请输入您的姓名" required />
    </div>
    <div class="form-group">
      <label>联系电话：</label>
      <input type="tel" id="phoneInput" placeholder="请输入您的手机号码" required />
    </div>
    <div class="form-group">
      <label>孩子年级：</label>
      <select id="gradeSelect">
        <option>一年级</option>
        <option>二年级</option>
        <option>三年级</option>
        <option>四年级</option>
        <option>五年级</option>
        <option>六年级</option>
        <option>初一</option>
        <option>初二</option>
        <option>初三</option>
      </select>
    </div>
    <div class="form-group">
      <label>咨询需求：</label>
      <textarea id="needsTextarea" rows="4" placeholder="请填写您想了解的托管需求（如：课后托、全托寄宿、假期辅导等）"></textarea>
    </div>
    <!-- 将 type="submit" 改为 type="button" 并绑定 onclick 事件 -->
    <button type="button" class="submit-btn" onclick="handleFormSubmit(event)">提交预约咨询</button>
  </form>
</section>

<!-- 直接把提交逻辑写在这里，彻底避开外部文件路径问题 -->
  <script>
    function handleFormSubmit() {
      console.log("--> 按钮被成功点击，开始获取数据...");

      const parentNameInput = document.getElementById('parentNameInput');
      const phoneInput = document.getElementById('phoneInput');
      const gradeSelect = document.getElementById('gradeSelect');
      const needsTextarea = document.getElementById('needsTextarea');

      if (!parentNameInput || !phoneInput) {
        alert("错误：页面未找到对应的输入框 id，请检查 HTML 结构！");
        return;
      }

      const parentName = parentNameInput.value.trim();
      const phone = phoneInput.value.trim();
      const grade = gradeSelect ? gradeSelect.value : '';
      const needs = needsTextarea ? needsTextarea.value.trim() : '';

      if (!parentName || !phone) {
        alert("请填写家长姓名和联系电话！");
        return;
      }

      // 组装表单数据
      const formData = new URLSearchParams();
      formData.append('id', parentName);          // 对应数据库中的 id (姓名)
      formData.append('phone_number', phone);     // 对应数据库中的 phone_number
      formData.append('grade', grade);            // 对应数据库中的 grade
      formData.append('Needs', needs);            // 对应数据库中的 Needs

      console.log("正在发往 Java 后端:", formData.toString());

      // 发送请求到本地 Java 后端 (8080 端口)
      fetch('http://localhost:8080/api/submit', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8'
        },
        body: formData.toString()
      })
      .then(response => response.text())
      .then(message => {
        alert(message); // 弹出 Java 后端返回的成功提示
        document.getElementById('consultForm').reset(); // 清空表单
      })
      .catch(error => {
        console.error('请求失败:', error);
        alert('无法连接到 Java 后端服务！请确认 IDEA 中的 BackendServer.java 已经在运行（监听 8080 端口）。');
      });
    }
  </script>
</body>
</html>
